name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-and-test:
    name: Backend (Java 25 + Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Uruchomienie testów i budowanie aplikacji (JAR)
        working-directory: ./spotify-backend
        run: mvn clean verify

  frontend-build-and-test:
    name: Frontend (React + Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./spotify-frontend/package-lock.json

      - name: Instalacja zależności frontendu
        working-directory: ./spotify-frontend
        run: npm ci

      - name: Uruchomienie testów jednostkowych Vitest
        working-directory: ./spotify-frontend
        run: npx vitest run

      - name: Weryfikacja budowania produkcyjnego (Vite build)
        working-directory: ./spotify-frontend
        run: npm run build