<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Administratora</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; color: white; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #282828; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; color: #1db954; }

        table { width: 100%; border-collapse: collapse; background-color: #181818; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #282828; }
        th { background-color: #282828; font-weight: bold; text-transform: uppercase; font-size: 0.9em; color: #b3b3b3; }
        tr:hover { background-color: #202020; }

        .btn-logout { padding: 10px 20px; background-color: #e91429; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background-color: #c01021; }
        .action-link { color: #b3b3b3; text-decoration: none; font-size: 0.9em; }
        .action-link:hover { color: white; }
    </style>
</head>
<body>

<div class="header">
    <h1>Zarządzanie Użytkownikami</h1>
    <!-- Formularz wylogowania ze Spring Security -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">Wyloguj Admina</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Spotify ID</th>
        <th>Nazwa Konta</th>
        <th>Adres Email</th>
        <th>Ostatnie Logowanie</th>
        <th>Akcje</th>
    </tr>
    </thead>
    <tbody>
    <!-- Pętla iterująca po wszystkich użytkownikach z PostgreSQL -->
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.spotifyId}">spotify_123</td>
        <td th:text="${user.displayName}">Wiktoria</td>
        <td th:text="${user.email}">wiki@example.com</td>
        <td th:text="${user.lastLoginDate}">2026-08-12</td>
        <td>
            <!-- Miejsce na funkcję usuwania i filtrowania -->
            <a href="#" class="action-link">Usuń dane</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
