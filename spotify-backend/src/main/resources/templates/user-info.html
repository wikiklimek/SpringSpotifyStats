<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Twoje Statystyki Spotify (Wersja API)</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; color: white; padding: 20px; margin: 0; }
        .profile-header { text-align: center; margin-bottom: 40px; padding: 20px; background: #181818; border-bottom: 1px solid #282828; }
        .profile-header img { border-radius: 50%; object-fit: cover; border: 3px solid #1db954; }

        /* Stylizacja menu */
        .nav-menu { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-btn {
            background-color: #282828; color: white; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .nav-btn:hover { background-color: #1db954; }
        .nav-btn.sync { background-color: #1db954; color: black; }
        .nav-btn.sync:hover { background-color: #1ed760; transform: scale(1.05); }

        /* Pojemnik na dynamiczną zawartość */
        .content-container { max-width: 800px; margin: 0 auto; background: #181818; padding: 30px; border-radius: 12px; min-height: 200px; }
        .item-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #282828; }
        .item-row img { border-radius: 4px; object-fit: cover; }
        .loader { text-align: center; color: #b3b3b3; font-style: italic; display: none; }
    </style>
</head>
<body>

<!-- Sekcja Profilu (Nadal renderowana na serwerze przez Thymeleaf) -->
<div class="profile-header">
    <img th:src="${user.getFirstImageUrl('/images/user.png')}" alt="Profil" width="120" height="120"/>
    <h1 th:text="'Witaj, ' + ${user.displayName} + '!'">Witaj!</h1>
    <p style="color: #b3b3b3;" th:text="${user.email}"></p>
</div>

<!-- Dynamiczne Menu Aplikacji (Twoje obecne) -->
<div class="nav-menu">
    <button class="nav-btn" onclick="fetchTopTracks()">🔥 Top 10 Utworów</button>
    <button class="nav-btn" onclick="fetchTopArtists()">🎤 Top 10 Artystów</button>
    <button class="nav-btn" onclick="fetchTopGenres()">🎸 Top Gatunki</button>
    <button class="nav-btn" onclick="fetchCurrentlyPlaying()">🎧 Czego teraz słucham?</button>
    <button class="nav-btn sync" onclick="syncHistory()">🔄 Zapisz Ostatnio Odtwarzane</button>
</div>

<!-- NOWE: Sekcja Zarządzania Prywatnością -->
<div style="text-align: center; margin-bottom: 30px; padding: 15px; background: #282828; border-radius: 8px; max-width: 800px; margin-left: auto; margin-right: auto;">
    <h3 style="margin-top: 0; color: #ff9800;">Zarządzanie Prywatnością (RODO)</h3>
    <button class="nav-btn" style="background-color: #e91429;" onclick="sendDeletionRequest()">Poproś o usunięcie (Starsze niż 7 dni)</button>
    <button class="nav-btn" style="background-color: #535353;" onclick="withdrawRequest()">Wycofaj swoją prośbę</button>
</div>

<!-- Główny pojemnik, do którego JavaScript będzie wstrzykiwał dane -->
<div class="content-container">
    <div id="loader" class="loader">Pobieranie danych z naszego Spring Boot API...</div>
    <div id="display-area">
        <h2 style="text-align: center; color: #b3b3b3;">Wybierz kategorię z menu powyżej, aby przetestować API!</h2>
    </div>
</div>

<script>
    // Referencje do elementów na stronie
    const displayArea = document.getElementById('display-area');
    const loader = document.getElementById('loader');

    // Funkcja pokazująca ładowanie
    function showLoader() {
        loader.style.display = 'block';
        displayArea.innerHTML = '';
    }

    // 1. Pobieranie Top Tracks
    async function fetchTopTracks() {
        showLoader();
        const response = await fetch('/api/top-tracks'); // Strzał do naszego backendu!
        const tracks = await response.json(); // Tłumaczenie odebranego JSONa na obiekt w JS

        let html = '<h2>Twoje Top 10 Utworów</h2>';
        tracks.forEach((track, index) => {
            // Wyciągamy obrazek z surowego JSON-a (Znak '?' zabezpiecza przed błędem jeśli brak obrazka)
            const imageUrl = track.album?.images?.[0]?.url || '/images/default.png';
            html += `
                <div class="item-row">
                    <span style="font-size: 1.2em; font-weight: bold; width: 30px;">${index + 1}.</span>
                    <img src="${imageUrl}" width="60" height="60" alt="Cover" />
                    <div>
                        <div style="font-weight: bold; font-size: 1.1em;">${track.name}</div>
                        <div style="color: #b3b3b3;">${track.artists[0]?.name}</div>
                    </div>
                </div>
            `;
        });
        loader.style.display = 'none';
        displayArea.innerHTML = html;
    }

    // 2. Pobieranie Top Artists
    async function fetchTopArtists() {
        showLoader();
        const response = await fetch('/api/top-artists');
        const artists = await response.json();

        let html = '<h2>Twoi Top 10 Artyści</h2>';
        artists.forEach((artist, index) => {
            const imageUrl = artist.images?.[0]?.url || '/images/default.png';
            html += `
                <div class="item-row">
                    <span style="font-size: 1.2em; font-weight: bold; width: 30px;">${index + 1}.</span>
                    <img src="${imageUrl}" width="60" height="60" style="border-radius: 50%;" alt="Artist" />
                    <div style="font-weight: bold; font-size: 1.1em;">${artist.name}</div>
                </div>
            `;
        });
        loader.style.display = 'none';
        displayArea.innerHTML = html;
    }

    // 3. Pobieranie Top Genres
    async function fetchTopGenres() {
        showLoader();
        const response = await fetch('/api/top-genres');
        const genresMap = await response.json(); // Otrzymujemy mapę z Springa jako JSON obiekt

        let html = '<h2>Twoje Top Gatunki (Obliczane w locie)</h2><ol style="font-size: 1.2em; line-height: 2;">';
        // Iteracja po kluczach i wartościach w JS
        for (const [genre, count] of Object.entries(genresMap)) {
            html += `<li><strong>${genre}</strong> <span style="color: #1db954;">(wystąpień: ${count})</span></li>`;
        }
        html += '</ol>';

        loader.style.display = 'none';
        displayArea.innerHTML = html;
    }

    // 4. Czego teraz słucham?
    async function fetchCurrentlyPlaying() {
        showLoader();
        const response = await fetch('/api/currently-playing');

        // Może zwrócić HTTP 204 (No Content), jeśli nic nie gra, więc musimy to sprawdzić!
        if (response.status === 204) {
            loader.style.display = 'none';
            displayArea.innerHTML = '<h2 style="text-align:center;">Aktualnie niczego nie słuchasz. Włącz coś na Spotify i kliknij ponownie!</h2>';
            return;
        }

        const data = await response.json();
        const track = data.item; // Obiekt Track jest zagnieżdżony w odpowiedzi
        const imageUrl = track.album?.images?.[0]?.url || '/images/default.png';
        const playingStatus = data.is_playing ? '🔊 Teraz odtwarzane' : '⏸ Wstrzymane';

        let html = `
            <h2 style="text-align: center; color: #1db954;">${playingStatus}</h2>
            <div style="text-align: center; margin-top: 20px;">
                <img src="${imageUrl}" width="200" height="200" style="border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);" alt="Cover" />
                <h1 style="margin: 15px 0 5px 0;">${track.name}</h1>
                <h3 style="color: #b3b3b3; margin-top: 0;">${track.artists[0]?.name}</h3>
            </div>
        `;

        loader.style.display = 'none';
        displayArea.innerHTML = html;
    }

    // 5. Zapisywanie Ostatnio Odtwarzanych
    async function syncHistory() {
        showLoader();
        // Endpoint zwraca zwykły tekst (String), więc używamy response.text(), a nie .json()
        const response = await fetch('/api/recently-played/sync');
        const resultText = await response.text();

        loader.style.display = 'none';
        displayArea.innerHTML = `
            <div style="text-align: center; padding: 40px;">
                <h1 style="font-size: 3em; margin-bottom: 10px;">✅</h1>
                <h2>${resultText}</h2>
                <p style="color: #b3b3b3;">Zajrzyj do bazy MongoDB w swoim Dockerze – dane są tam bezpieczne!</p>
            </div>
        `;
    }

    // 6. Funkcja wysyłająca prośbę o usunięcie (POST)
    async function sendDeletionRequest() {
        showLoader();
        // Wykonujemy zapytanie typu POST
        const response = await fetch('/api/privacy/request-deletion?days=7', { method: 'POST' });
        const resultText = await response.text();

        loader.style.display = 'none';
        displayArea.innerHTML = `
            <div style="text-align: center; padding: 40px;">
                <h1 style="font-size: 3em; margin-bottom: 10px;">🛡️</h1>
                <h2 style="color: #ff9800;">${resultText}</h2>
                <p style="color: #b3b3b3;">Administrator otrzymał Twoje zgłoszenie.</p>
            </div>
        `;
    }

    // 7. Funkcja wycofująca prośbę (POST)
    async function withdrawRequest() {
        showLoader();
        const response = await fetch('/api/privacy/withdraw', { method: 'POST' });
        const resultText = await response.text();

        loader.style.display = 'none';
        displayArea.innerHTML = `
            <div style="text-align: center; padding: 40px;">
                <h1 style="font-size: 3em; margin-bottom: 10px;">✅</h1>
                <h2 style="color: #1db954;">${resultText}</h2>
            </div>
        `;
    }
</script>

</body>
</html>
