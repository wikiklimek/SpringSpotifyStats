<!DOCTYPE html>
<!-- Dodajemy przestrzeń nazw Thymeleaf, żeby przeglądarka rozumiała atrybuty th:* -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Twoje Statystyki Spotify</title>
    <!-- Później podepniemy tu Twój plik styles.css, na razie zróbmy proste style wbudowane -->
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; color: white; padding: 20px; }
        .container { display: flex; gap: 40px; }
        .list-section { background: #181818; padding: 20px; border-radius: 8px; flex: 1; }
        img { border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

<!-- Sekcja Profilu -->
<div style="text-align: center; margin-bottom: 40px;">
    <img th:src="${user.getFirstImageUrl('/images/user.png')}" alt="Profil" width="150" height="150"/>
    <h1 th:text="'Witaj, ' + ${user.displayName} + '!'">Witaj, Użytkowniku!</h1>
    <p th:text="'Twój email: ' + ${user.email}"></p>
</div>

<div class="container">
    <!-- Sekcja Top 10 Utworów -->
    <div class="list-section">
        <h2>Twoje Top 10 Utworów</h2>
        <ul>
            <!-- Magia Thymeleaf: pętla iterująca po liście "tracks" z modelu -->
            <li th:each="track, stat : ${tracks}" style="margin-bottom: 15px; display: flex; align-items: center; gap: 15px;">
                <span th:text="${stat.count} + '.'">1.</span>
                <img th:src="${track.album().getFirstImageUrl('/images/default.png')}" width="50" height="50" alt="Okładka"/>
                <div>
                    <strong th:text="${track.name()}">Nazwa utworu</strong><br/>
                    <small th:text="${track.artists().get(0).name()}">Nazwa Artysty</small>
                </div>
            </li>
        </ul>
    </div>

    <!-- Sekcja Top 10 Artystów -->
    <div class="list-section">
        <h2>Twoi Top 10 Artyści</h2>
        <ul>
            <li th:each="artist, stat : ${artists}" style="margin-bottom: 15px; display: flex; align-items: center; gap: 15px;">
                <span th:text="${stat.count} + '.'">1.</span>
                <img th:src="${artist.getFirstImageUrl('/images/default.png')}" width="50" height="50" alt="Artysta"/>
                <strong th:text="${artist.name()}">Nazwa artysty</strong>
            </li>
        </ul>
    </div>

    <!-- Sekcja Top Gatunków -->
    <div class="list-section">
        <h2>Twoje Top Gatunki</h2>
        <ul>
            <li th:each="genreEntry, stat : ${genres}" style="margin-bottom: 10px;">
                <strong th:text="${stat.count} + '. ' + ${genreEntry.key}">1. Pop</strong>
                <span style="color: #1db954;" th:text="' (wystąpień: ' + ${genreEntry.value} + ')'"> (wystąpień: 3)</span>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
